<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1b2340" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#d9d6ee" media="(prefers-color-scheme: light)">
<title>NicoPrensa</title>
<meta name="description" content="Las noticias del día para Londres, Colombia y Brasil.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Figtree:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
  <header class="bar">
    <a class="logo" href="./">Nico<b>Prensa</b></a>
    <button id="menuBtn" class="round" type="button" aria-expanded="false" aria-controls="menu" aria-label="Días anteriores">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>
    </button>
  </header>
  <nav id="menu" class="menu card" hidden aria-label="Ediciones anteriores">
    <h2>Ediciones anteriores</h2>
    <div id="menuList"></div>
  </nav>
  <main id="app" aria-live="polite"><p class="note">Cargando las noticias…</p></main>
  <footer class="foot" id="pie"></footer>
</div>
<script src="app.js"></script>

</html>
