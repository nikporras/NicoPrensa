name: Candidatos del día

on:
  schedule:
    - cron: "45 5 * * *"   # 05:45 UTC, todos los días
  workflow_dispatch:        # botón manual "Run workflow"

permissions:
  contents: write

concurrency:
  group: candidatos
  cancel-in-progress: false

jobs:
  candidatos:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install --quiet feedparser

      - name: Recoger titulares
        run: python scripts/candidatos.py

      - name: Guardar en main
        run: |
          git config user.name "nikporras"
          git config user.email "nikporras@users.noreply.github.com"
          git add -A data/candidatos
          if git diff --cached --quiet; then
            echo "Sin cambios."
            exit 0
          fi
          git commit -m "Candidatos $(TZ=Europe/London date +%F)"
          for intento in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 5
          done
          exit 1
