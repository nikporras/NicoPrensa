name: Candidatos del día

on:
  schedule:
    # GitHub a veces se salta o retrasa un horario. Por eso hay varios intentos cada madrugada (UTC),
    # todos antes de la tarea que arma la edición. Cada corrida reemplaza a la anterior.
    - cron: "17 3 * * *"
    - cron: "47 3 * * *"
    - cron: "17 4 * * *"
    - cron: "47 4 * * *"
    - cron: "17 5 * * *"
  workflow_dispatch:        # botón manual "Run workflow"

permissions:
  contents: write

concurrency:
  group: candidatos
  cancel-in-progress: false

jobs:
  candidatos:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install --quiet feedparser

      - name: Recoger titulares
        id: recoger
        continue-on-error: true
        run: python scripts/candidatos.py

      - name: Guardar en main
        run: |
          git config user.name "nikporras"
          git config user.email "nikporras@users.noreply.github.com"
          git add -A data/candidatos
          if git diff --cached --quiet; then
            echo "Sin cambios."
            exit 0
          fi
          git commit -m "Candidatos $(TZ=Europe/London date +%F)"
          for intento in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 5
          done
          exit 1

      - name: Avisar si algo anduvo mal
        if: steps.recoger.outcome == 'failure'
        run: |
          echo "El mensajero terminó con errores. Revisa el paso 'Recoger titulares'."
          exit 1
